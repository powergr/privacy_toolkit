<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests;"
    />
    <title>Contact Us - QRE Privacy Toolkit</title>
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://projectqre.com/contact.html" />
    <meta property="og:title" content="Contact Project QRE" />
    <meta property="og:description" content="Have a question about our quantum-resistant encryption project, a technical inquiry, or want to collaborate? Get in touch with us." />
    <meta property="og:image" content="https://projectqre.com/images/qre-social-share.webp" />
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://projectqre.com/contact.html" />
    <meta property="twitter:title" content="Contact Project QRE" />
    <meta property="twitter:description" content="Have a question about our quantum-resistant encryption project, a technical inquiry, or want to collaborate? Get in touch with us." />
    <meta property="twitter:image" content="https://projectqre.com/images/qre-social-share.webp" />
    <meta name="description" content="Get in touch with the team at Project QRE." />
    <link rel="canonical" href="https://projectqre.com/contact.html" />

    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&family=Orbitron:wght@400;700&family=Roboto+Mono&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet';"
    />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&family=Orbitron:wght@400;700&family=Roboto+Mono&display=swap" /></noscript>

    <link rel="stylesheet" href="styles.css" />

    <!-- Page-specific: contact h2 is centered -->
    <style>
      h2 { text-align: center; }
    </style>

    <script>
      (function () {
        const theme = localStorage.getItem("qre_theme") || "dark";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <button id="theme-toggle" title="Toggle light/dark theme">
      <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <header>
      <div class="container">
        <h1>Contact Us</h1>
        <p class="subtitle">We'd love to hear from you</p>
      </div>
    </header>

    <nav class="breadcrumb-nav container">
      <a href="index.html">Home</a> &gt; Contact
    </nav>

    <main class="container">
      <section>
        <h2>Get In Touch</h2>
        <p class="contact-intro">
          Have a question about the project, a technical inquiry, or want to
          follow our progress? Please fill out the form below, and we'll get
          back to you as soon as possible.
        </p>

        <form class="contact-form" action="https://formspree.io/f/mqabpeyj" method="POST">
          <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" required />
          </div>
          <div class="form-group">
            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>
          <button type="submit" class="submit-btn">Send Message</button>
        </form>
      </section>
    </main>

    <div id="footer-placeholder"></div>
    <script src="shared.js"></script>
  </body>
</html>
